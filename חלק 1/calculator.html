<style>
/* Tambour quantity calculator, v2: one question per screen, big visual choices, result first. Single committed light look. */
:root{
  --bg:#FFFFFF; --ink:#333032; --muted:#5C595B; --line:#E5E5E5; --grid:#ECEAEA; --soft:#F6F5F4; --soft2:#F1F1F1;

  --font:'Heebo','Arial Hebrew',Arial,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{margin:0;color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.5;direction:rtl}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--red);outline-offset:3px}
.num{font-variant-numeric:tabular-nums}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
/* header */
.top{background:var(--ink);color:#fff;font-size:12px;padding-inline:20px}
.top .in{max-width:1200px;margin-inline:auto;display:flex;justify-content:space-between;padding-block:8px}
.nav{background:var(--bg);border-bottom:1px solid var(--line);padding-inline:20px}
.nav .in{max-width:1200px;margin-inline:auto;display:flex;align-items:center;gap:40px;padding-block:14px}
.logo{display:flex;align-items:center;gap:6px;color:var(--red);font-weight:900;font-size:24px;letter-spacing:-.02em}
.logo i{width:18px;height:18px;background:var(--red);display:inline-block;clip-path:polygon(0 0,100% 0,100% 100%,40% 100%,40% 60%,0 60%)}
.links{display:flex;gap:30px;font-size:14px;font-weight:500;flex:1}
.pro-t{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:800;cursor:pointer;white-space:nowrap}
.sw-t{width:42px;height:24px;border-radius:999px;background:#CFCDCD;position:relative;transition:background .15s;flex:none}
.sw-t::after{content:"";position:absolute;top:3px;right:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:right .15s}
.pro-t input{position:absolute;opacity:0;width:1px;height:1px}
.pro-t input:checked+.sw-t{background:var(--ink)}
.pro-t input:checked+.sw-t::after{right:21px}
.pro-t input:focus-visible+.sw-t{outline:3px solid var(--red);outline-offset:2px}
@media (max-width:900px){.links{display:none}.nav .in{justify-content:space-between}}
/* stage */
main{background-color:var(--bg);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:126px 126px;background-position:center top;padding:40px 16px 96px;min-height:80vh}
.card{max-width:960px;margin-inline:auto;background:var(--bg);border:1px solid var(--line);padding:40px 48px 44px;min-width:0}
@media (max-width:640px){.card{padding:24px 18px 28px}main{padding-top:20px}}
.prog{display:flex;gap:6px;margin-bottom:28px}
.prog i{flex:1;height:4px;border-radius:2px;background:var(--line)}
.prog i.on{background:var(--red)}
.kicker{font-size:13px;font-weight:800;color:var(--red);margin:0 0 6px;letter-spacing:.04em}
h1.q{margin:0 0 6px;font-size:34px;font-weight:900;line-height:1.15;letter-spacing:-.01em}
.sub{margin:0 0 28px;color:var(--muted);font-size:17px}
@media (max-width:640px){h1.q{font-size:27px}}
/* tiles */
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(176px,1fr));gap:12px}
.tile{border:1.5px solid var(--line);background:var(--bg);border-radius:8px;padding:20px 16px 18px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;min-height:148px;justify-content:center;transition:border-color .12s,transform .12s}
.tile:hover{border-color:var(--ink)}
.tile[aria-pressed="true"]{border-color:var(--red);box-shadow:inset 0 0 0 1.5px var(--red);background:#FFF7F9}
.tile svg{width:44px;height:44px;stroke:var(--ink);fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.tile[aria-pressed="true"] svg{stroke:var(--red)}
.tile b{font-size:17px;font-weight:800;line-height:1.25}
.tile small{font-size:13px;color:var(--muted);font-weight:500;line-height:1.35}
.tiles.sm .tile{min-height:112px;padding:16px 12px}
.tiles.sm .tile svg{width:34px;height:34px}
/* size */
.custom{margin-top:18px;border-top:1px solid var(--line);padding-top:18px}
.custom summary{cursor:pointer;font-weight:800;font-size:15px;list-style:none;display:inline-flex;align-items:center;gap:8px}
.custom summary::-webkit-details-marker{display:none}
.custom summary::before{content:"+";width:22px;height:22px;border-radius:50%;border:1.5px solid var(--ink);display:inline-grid;place-items:center;font-size:15px;line-height:1}
.custom[open] summary::before{content:"−"}
.steppers{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px;margin-top:16px}
.stp{display:flex;flex-direction:column;gap:6px}
.stp>span{font-size:14px;font-weight:700;color:var(--muted)}
.stp .ctl{display:flex;align-items:center;border:1.5px solid #D4D2D2;border-radius:8px;overflow:hidden;height:52px}
.stp button{width:52px;height:100%;border:0;background:var(--soft);font-size:22px;font-weight:700;cursor:pointer;flex:none}
.stp button:hover{background:var(--soft2)}
.stp input{flex:1;min-width:0;border:0;text-align:center;font-size:20px;font-weight:800;height:100%;-moz-appearance:textfield}
.stp input::-webkit-outer-spin-button,.stp input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.stp input:focus{outline:none;background:#FFF7F9}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.chip{border:1.5px solid var(--line);background:var(--bg);border-radius:999px;padding:8px 16px;font-size:15px;font-weight:700;cursor:pointer}
.chip[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:#fff}
.area-live{margin-top:18px;display:flex;align-items:baseline;gap:8px;font-size:15px;color:var(--muted);font-weight:700}
.area-live b{font-size:30px;color:var(--ink);font-weight:900}
/* shades */
.fams{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.fams button{display:flex;align-items:center;gap:7px;border:1.5px solid var(--line);background:var(--bg);border-radius:999px;padding:7px 14px;font-size:14px;font-weight:700;cursor:pointer}
.fams i{width:12px;height:12px;border-radius:50%;box-shadow:inset 0 0 0 1px rgba(0,0,0,.15)}
.fams button[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:#fff}
.swg{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:8px}
.swc{border:0;padding:0;cursor:pointer;border-radius:6px;aspect-ratio:1/1;position:relative;box-shadow:inset 0 0 0 1px rgba(0,0,0,.08)}
.swc[aria-pressed="true"]{outline:3px solid var(--ink);outline-offset:2px}
.swc[aria-pressed="true"]::after{content:"✓";position:absolute;top:6px;left:8px;font-weight:900;font-size:15px;color:#333032;background:#fff;width:22px;height:22px;border-radius:50%;display:grid;place-items:center}
.picked{display:flex;align-items:center;gap:14px;margin-top:20px;padding:14px;border:1px solid var(--line);border-radius:8px}
.picked span{width:52px;height:52px;border-radius:6px;flex:none;box-shadow:inset 0 0 0 1px rgba(0,0,0,.1)}
.picked b{display:block;font-size:18px;font-weight:900;text-transform:uppercase}
.picked small{font-size:14px;color:var(--muted);font-weight:600}
/* nav buttons */
.foot{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:32px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1.5px solid var(--ink);background:var(--bg);padding:0 22px;height:52px;font-size:16px;font-weight:800;cursor:pointer;border-radius:8px;white-space:nowrap}
.btn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.9}
.btn.red{background:var(--red);border-color:var(--red);color:#fff;min-width:180px}
.btn.red:hover{background:var(--red-d)}
.btn.ghost{border-color:transparent;padding:0 8px}
.btn[disabled]{opacity:.4;cursor:not-allowed}

.res-hd .tag{display:inline-flex;align-items:center;gap:8px;background:var(--soft2);border-radius:999px;padding:6px 14px;font-size:14px;font-weight:700}
.res-hd .tag i{width:14px;height:14px;border-radius:50%;box-shadow:inset 0 0 0 1px rgba(0,0,0,.15)}
.flow{display:flex;flex-direction:column;gap:12px}
.pcard{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:16px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:18px 20px}
.pcard .no{width:44px;height:44px;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center;font-weight:900;font-size:18px}
.pcard .what{font-size:13px;font-weight:800;color:var(--red)}
.pcard h3{margin:2px 0 2px;font-size:20px;font-weight:900;line-height:1.2}
.pcard p{margin:0;font-size:14px;color:var(--muted)}
.cans{display:flex;gap:8px;align-items:flex-end;justify-content:flex-end;flex-wrap:wrap;max-width:300px}
.can{display:flex;flex-direction:column;align-items:center;gap:4px}
.can svg{display:block}
.can small{font-size:13px;font-weight:800;white-space:nowrap}
.need{font-size:12px;color:var(--muted);font-weight:700;text-align:left;margin-top:6px}

.tip{display:flex;gap:10px;align-items:flex-start;font-size:15px;line-height:1.5;background:var(--red-tint);padding:12px 16px;border-radius:8px;margin-top:14px}
.tip svg{width:18px;height:18px;flex:none;stroke:var(--red);fill:none;stroke-width:2;margin-top:3px}
.time{display:flex;gap:10px;align-items:center;font-size:15px;font-weight:700;margin-top:14px;color:var(--muted)}
.time svg{width:20px;height:20px;stroke:var(--muted);fill:none;stroke-width:1.8}
.more{margin-top:20px;border:1px solid var(--line);border-radius:10px}

.more>summary::-webkit-details-marker{display:none}
.more>summary::after{content:"";width:9px;height:9px;border-inline-start:2px solid var(--ink);border-bottom:2px solid var(--ink);transform:rotate(-45deg);transition:transform .15s}
.more[open]>summary::after{transform:rotate(135deg)}
.more .in{padding:0 20px 20px;display:flex;flex-direction:column;gap:14px}
.edit-row{display:grid;grid-template-columns:minmax(0,1fr) 170px;gap:12px;align-items:end}

.bi{display:grid;grid-template-columns:14px minmax(0,1fr) auto;gap:12px;padding:14px 0;align-items:center}

.bi small{display:block;font-size:13px;color:var(--muted);font-weight:600}
.bi .pk{text-align:left;font-weight:900;font-size:16px}
.bacts{display:flex;gap:10px;padding:16px 24px 20px;flex-wrap:wrap;border-top:1px solid var(--line)}
.bacts .btn{flex:1}
.pro-box{display:none}
body.pro .pro-box{display:flex}
.pro-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}
.chk{display:flex;gap:10px;align-items:center;font-size:15px;font-weight:700;cursor:pointer}
.chk input{accent-color:var(--red);width:20px;height:20px}
.src{max-width:960px;margin:14px auto 0;font-size:13px;color:var(--muted);line-height:1.6}
.toast{position:fixed;bottom:24px;left:50%;transform:translate(-50%,20px);background:var(--ink);color:#fff;padding:12px 20px;border-radius:8px;font-size:15px;font-weight:700;opacity:0;transition:.2s;pointer-events:none;z-index:9}
.toast.on{opacity:1;transform:translate(-50%,0)}
.printonly{display:none}
@media print{.top,.nav,.prog,.foot,.more,.bacts,.sitem .x,.toast,#stage{display:none !important}main{background:none;padding:0}.basket{border:0}.printonly{display:block}}

</style>
